name: Deploy blog to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages publishing source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')
          if [ "$source_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One-time setup: Settings > Pages > Source > GitHub Actions, then run this workflow again."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-source.outputs.ready == 'true'
      - name: Deploy to GitHub Pages
        if: steps.pages-source.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
